<!DOCTYPE html>
<html>
<head>
  <title>Modern Calculator</title>
  <style>
    body {
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }

    .calculator {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.829);
    }

   #display {
  width: 92%;
  height: 50px;
  margin-bottom: 10px;
  font-size: 20px;
  text-align: right;
  border-radius: 15px;
  border: none;
  padding: 15px;
  background: linear-gradient(135deg, #1c37b3, #764ba2);
  color: white;
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
}

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 10px;
    }

    button {
      height: 60px;
      border-radius: 15px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      background: #333;
      color:black;
      transition: 0.3s;
    }

    button:hover {
      background: #ff9800;
    }

    .equal {
      grid-column: span 2;
      background: #4caf50;
    }
  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" disabled>

  <div class="buttons">
    <button onclick="clearAll()">C</button>
    <button onclick="add('/')">/</button>
    <button onclick="add('*')">*</button>
    <button onclick="add('-')">-</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('+')">+</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="calculate()" class="equal">=</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('0')">0</button>
  </div>
</div>

<script>
function add(value){
  display.value += value;
  console.log(display.value);
}
function calculate(){
  display.value = eval(display.value);
}
function clearAll(){
  display.value = "";
}
</script>

</body>
</html>
